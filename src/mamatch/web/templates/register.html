{% extends "base.html" %}
{% block title %}{{ T('买方注册', 'Register as a buyer') }}{% endblock %}
{% block body %}
<form class="panel narrow grid" method="post" action="{{ P }}/register">
  <h1 class="wide">{{ T('买方注册', 'Register as a buyer') }}</h1>
  <label class="wide">{{ T('邮箱', 'Email') }} <input name="email" type="email" autocomplete="username" required></label>
  <label class="wide">{{ T('密码（至少10位）', 'Password (10+ characters)') }} <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>{{ T('姓名', 'Your name') }} <input name="name" required></label>
  <label>{{ T('公司或机构', 'Company or fund') }} <input name="organization"></label>
  <label class="wide">{{ T('类型', 'You are') }} <select name="kind">{% for k, v in BUYER_KINDS.items() %}<option value="{{ k }}">{{ L(v) }}</option>{% endfor %}</select></label>
  <label class="check wide"><input type="checkbox" name="consent" value="1" required> {{ T('同意服务条款与隐私说明：信息仅用于匹配与核验，不公开展示', 'I accept the terms and privacy notice: my information is used for matching and verification, never shown publicly.') }}</label>
  <div class="wide"><button>{{ T('注册', 'Register') }}</button></div>
</form>
{% endblock %}

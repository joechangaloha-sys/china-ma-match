{% extends "base.html" %}
{% block title %}{{ T('登录', 'Sign in') }}{% endblock %}
{% block body %}
<form class="panel narrow grid" method="post" action="{{ P }}/login">
  <h1 class="wide">{{ T('登录', 'Sign in') }}</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label class="wide">{{ T('邮箱', 'Email') }} <input id="email" name="email" type="email" autocomplete="username" required></label>
  <label class="wide">{{ T('密码', 'Password') }} <input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <div class="wide"><button>{{ T('登录', 'Sign in') }}</button></div>
  <p class="wide small muted">{{ T('买方可', 'Buyers can') }} <a href="{{ P }}/register">{{ T('注册', 'register') }}</a>{{ T('；卖方账户由交易经理邀请开通。', '; seller accounts are opened by invitation from your deal manager.') }}</p>
</form>
{% endblock %}

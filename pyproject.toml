[project]
name = "mamatch"
version = "0.1.0"
description = "AI deal-origination workspace for Chinese boutique M&A advisers, built on a buyer-intent index of listed acquirers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pypdf>=6.21.2",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "segno==1.6.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
]

[project.scripts]
mamatch = "mamatch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mamatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

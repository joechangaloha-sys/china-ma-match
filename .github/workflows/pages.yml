# Builds the static demo (fictional example data only) and publishes it with GitHub Pages.
# In the repository settings, set Pages > Source to "GitHub Actions".
name: Static demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          MAMATCH_LLM: "off"
      - run: uv run mamatch export-static --out static-demo
        env:
          MAMATCH_LLM: "off"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
